# Coolify için Beszel hub ve yerel agent; sırlar servis ortamında tutulur.
services:
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION:-0.21.1}
    environment:
      - SERVICE_URL_BESZEL_8090
      - APP_URL=https://${BESZEL_DOMAIN}
      - USER_EMAIL=${BESZEL_USER_EMAIL}
      - USER_PASSWORD=${BESZEL_USER_PASSWORD}
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    healthcheck:
      test: [CMD, /beszel, health, --url, 'http://localhost:8090']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION:-0.21.1}
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY}
      - TOKEN=${BESZEL_AGENT_TOKEN}
      - LOG_LEVEL=warn
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, /agent, health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
volumes:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
